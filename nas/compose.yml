# El semáforo de privacidad del Repositorio VCE en el NAS (ADR 0006).
#
#   docker compose up -d --build                         construir y arrancar
#   docker logs -f guia-privacidad                       ver el reloj
#   docker exec guia-privacidad /proyecto/nas/noche.sh   una pasada a mano (--todas: todas las aplicaciones)
#
# En /volume1/docker/guia-privacidad: repo (el código, clon de desplegar-nas) y sitio (otro clon,
# donde se escriben y se suben los datos; repo no se toca, para que el vigía no lo tome por un arreglo).
services:
  guia-privacidad:
    build:
      context: ./repo/nas
    image: guia-privacidad:local
    container_name: guia-privacidad
    restart: unless-stopped
    user: "1000:10"
    entrypoint: ["/proyecto/nas/reloj.sh"]
    environment:
      TZ: Europe/Madrid
      HOME: /tmp
      PLAYWRIGHT_BROWSERS_PATH: /opt/playwright
      CATALOGO_CRED: /credenciales/catalogo-vce.json
    # Un Chromium con tres pestañas a la vez cabe de sobra.
    cpus: 1.5
    mem_limit: 2g
    volumes:
      - ./repo:/proyecto:ro
      - ./sitio:/sitio
      - ./estado:/estado
      # La clave de la API de la hoja del repositorio, la misma del bot (solo para leer).
      - ../bot-chatgpt-ia-edu/credenciales/catalogo-vce.json:/credenciales/catalogo-vce.json:ro
      # La clave de despliegue del repositorio (ADR 0012 de vigilancia-nas), solo para leer.
      - ../vigilancia/home/.ssh/arreglos/guia-privacidad-edu.github.io:/claves:ro
      # El aviso a Juanjo por Telegram, el mismo de los demás contenedores.
      - ../boletin-semanal/home/.local/bin/avisar-juanjo:/usr/local/bin/avisar-juanjo:ro
      - ../boletin-semanal/home/.config/avisar-juanjo:/tmp/.config/avisar-juanjo
